name: CI

# Validates every push / pull request.
# Runs without any access to the retired dev VM, candidate data, credentials,
# or hosted services. External actions (eSampark upload, email, WhatsApp,
# SMS, voice) remain disabled by default and are asserted by the tests.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test-linux:
    name: Linux · Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install runtime + dev/test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Import / bootstrap check
        run: python -c "from app.main import app; print('app imports OK')"

      - name: JS syntax check (requires Node, present on runners)
        run: |
          for f in app/static/app.js app/static/ui.js app/static/manual_entry.js; do
            node --check "$f"
          done

      - name: Run full cross-platform test suite
        run: >-
          python -m pytest tests/
          --ignore=tests/benchmark_ocr.py
          -q
          -p no:cacheprovider

  test-windows:
    name: Windows · Python 3.12
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install runtime + dev/test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Import / bootstrap check
        run: python -c "from app.main import app; print('app imports OK')"

      - name: Fresh DB + master/template load + generation smoke
        run: >-
          python -m pytest
          tests/test_production_hardening.py
          tests/test_integration.py
          tests/test_onboarding_pair.py
          tests/test_template_smoke.py
          tests/test_facility_dropdown.py
          tests/test_review_workflow.py
          -q
          -p no:cacheprovider

      - name: Run remaining cross-platform tests
        run: >-
          python -m pytest tests/
          --ignore=tests/benchmark_ocr.py
          --ignore=tests/test_production_hardening.py
          --ignore=tests/test_integration.py
          --ignore=tests/test_onboarding_pair.py
          --ignore=tests/test_template_smoke.py
          --ignore=tests/test_facility_dropdown.py
          --ignore=tests/test_review_workflow.py
          -q
          -p no:cacheprovider